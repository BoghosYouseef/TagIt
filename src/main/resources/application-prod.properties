app.title=TagIt
app.window.width=1200
app.window.height=800

app.minimumWindowWidth=800.0
app.minimumTabPaneWidth=100.0

db.databaseName=TagItDataBase
db.databasePath=src/main/resources/databases
db.databaseInitScriptName=V1__create_Table.sql
db.databaseInitScriptPath=src/main/java/com/tagit/db/migration/${db.databaseInitScriptName}.sql

hibernate.dialect=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
# this allows injecting the application context
# more info: https://vladmihalcea.com/spring-transaction-connection-management/
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION 
spring.datasource.url=jdbc:sqlite:${db.databasePath}/${db.databaseName}.db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=org.sqlite.JDBC

# Flyway Configuration 
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# spring.datasource.initialization-mode=always
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework=INFO
logging.level.org.flywaydb=DEBUG